services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    container_name: feastmath-db
    environment:
      POSTGRES_USER: feast
      POSTGRES_PASSWORD: feast
      POSTGRES_DB: feastmath
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - feastmath_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feast -d feastmath"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  feastmath_pgdata:
